<!-- File: Kitsune-den_Version8.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kitsune</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'><text y='90' font-size='90'>🦊</text></svg>">
  <style>
    /* [ ... Full style from Version 7 ... ] */
    html, body { height: 100%; min-height: 100%; }
    body {
      position: relative;
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', 'Arial', sans-serif;
      color: #f0eee6;
      background: radial-gradient(ellipse 70% 80% at 80% 10%, #27294a 50%, transparent 100%),
                  radial-gradient(ellipse 60% 60% at 10% 95%, #201f38 48%, transparent 100%),
                  linear-gradient(120deg, #191827 0%, #21203c 90%);
      overflow: hidden;
    }
    /* username/password modals layering, rest visually unchanged ... */
    .username-modal, .password-modal {
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: radial-gradient(ellipse 90% 80% at 60% 10%, #31191a40 35%, transparent 100%),
                  radial-gradient(ellipse 68% 76% at 13% 97%, #16181d88 48%, transparent 100%),
                  linear-gradient(115deg,#201626e9 60%, #241f32f7 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.18s;
      backdrop-filter: blur(6px) saturate(1.08);
      -webkit-backdrop-filter: blur(7px) saturate(1.13);
      animation: modalFadeIn 1s cubic-bezier(.21,0,.18,1);
    }
    .username-modal-content, .password-modal-content {
      position: relative;
      background: linear-gradient(129deg,#251c30e6 83%, #312a35e3 100%);
      border-radius: 32px;
      box-shadow:
        0 0 0 8px #fca31133,
        0 0 42px 0 #813c1190,
        0 11px 48px 16px #38111a66,
        0 3px 24px #9250ff18;
      padding: 2.7rem 1.35rem 2rem 1.35rem;
      width: 95vw;
      max-width: 370px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
    }
    .username-modal-content::before, .password-modal-content::before {
      content: '';
      position: absolute;
      inset: -16px -11px -22px -11px;
      z-index: 0;
      border-radius: 40px;
      background:
        radial-gradient(ellipse 40% 40% at 42% 10%, #fca31122 0, transparent 80%),
        radial-gradient(ellipse 60% 74% at 80% 78%, #50dafb33 0, transparent 80%),
        radial-gradient(ellipse 30% 30% at 18% 90%, #ffb94024 0, transparent 70%);
      filter: blur(10px);
      opacity: 0.9;
      pointer-events: none;
    }
    .modal-fox {
      font-size: 2.6rem;
      margin-bottom: 7px;
      text-shadow:
        0 1px 20px #fca3117c, 0 0 2px #fff, 0 2px 48px #fca311;
      display: block; z-index: 2;
      pointer-events: none;
      filter: drop-shadow(0 0 11px #fa610835);
      animation: foxPulse 2.8s infinite alternate cubic-bezier(.2,0,.6,1);
    }
    .username-modal-content h2, .password-modal-content h2 {
      color: #ffa014; font-size: 1.42rem; font-weight: 800; letter-spacing: 0.01em;
      margin: 0 0 1.2em 0;
      text-shadow:
        0 2px 18px #fca311b8,
        0 1px 44px #15121b44,
        0 1px 0 #e59a0b40;
      background: linear-gradient(92deg, #ffe7be 21%, #fca311 44%, #e86e18 83%, #ff4600 98%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      z-index: 2;
      position: relative;
    }
    .username-modal input[type="text"] {
      padding: 1em 1.25em;
      border-radius: 24px;
      border: 2.2px solid #fca311cc;
      font-size: 1.19rem;
      margin: 0.3em 0 1.1em 0;
      background: linear-gradient(95deg, #271e31 80%, #3a221133 100%);
      color: #ffeecc; width: 93%;
      box-shadow: 0 2px 13px #fd7e1422, 0 1.5px 6px #52151514;
      font-family: inherit; font-weight: 420; letter-spacing: 0.04em;
      outline: none; z-index: 2;
      backdrop-filter: blur(2.1px); -webkit-backdrop-filter: blur(2.3px);
      transition: border-color 0.23s, background 0.18s, box-shadow 0.23s;
    }
    .username-modal input[type="text"]:focus {
      border-color: #ffae3c; background: #412f19d9;
      box-shadow: 0 2px 22px 3px #fd7e1440;
    }
    .username-modal button {
      padding: 1em 2.1em; border-radius: 23px; border: none;
      background: linear-gradient(94deg,#fca311 61%,#ff4600 100%);
      color: #372d1d;
      font-weight: 690; font-size: 1.11rem; letter-spacing: 0.014em;
      margin-top: 0.4em; margin-bottom: 4px; box-shadow: 0 4px 15px #fca31138;
      transition: background 0.18s, color 0.13s, transform 0.08s, box-shadow 0.19s;
      cursor: pointer; font-family: inherit; z-index: 2; outline: none;
      border: 2px solid #ffae3c55; user-select: none;
    }
    .username-msg {
      color: #ff6666;
      min-height: 1.15em;
      margin: 0.7em 0 0 0;
      font-size: 1rem;
      letter-spacing: 0.01em;
      text-align: center;
      text-shadow: 0 1px 4px #1a1215be;
      z-index: 2;
      font-family: 'Segoe UI',Arial,sans-serif;
      opacity: 1; transition: opacity .1s;
    }
    /* [ ... Existing modal/pass/lockout styles ... ] */

    /* All rest of original version 7 styles remain unchanged below... */
    .congrats-modal, .congrats-popup, .congrats-fox, .congrats-title, .congrats-msg, .congrats-close-btn, .message,
    .container, .foxfire-glow, .fox-aura-wrapper, .kitsune-aura, .fox-emoji, .aura-spark, h1, form,
    .search-bar, button, .orbs-bg, .orb, ::placeholder, .disable-blur, .lockout-cooldown, .lockout-blocked,
    .hard-blocker, .hard-blocker h1, .hard-blocker .hard-emoji, .hard-blocker .hard-msg, .hard-blocker .timer
    {
      /* No change, same as previous version! */
    }
    @media (max-width: 480px) {
      .username-modal-content, .password-modal-content,
      .congrats-popup { padding: 1.2rem 0.6rem 1.0rem 0.6rem; max-width: 99vw; }
      .congrats-fox { font-size: 2rem;}
      .username-modal input[type="text"],
      .password-modal input[type="password"]{ font-size: 1rem; width: 99%; }
      .username-modal button, .password-modal button, .congrats-close-btn { width: 100%; }
      .modal-fox { font-size: 1.8rem; }
    }
  </style>
</head>
<body>
  <!-- Hard block overlay -->
  <div id="hardBlocker" class="hard-blocker" style="display:none;">
    <span class="hard-emoji">🦊❌</span>
    <h1>Locked Out!</h1>
    <div class="hard-msg">
      The fox spirits have closed the Den for a full day.<br>
      Please try again after:<br>
      <span class="timer" id="hardBlockTimer"></span>
    </div>
  </div>
  <!-- Username Modal Overlay (first thing -- new) -->
  <div class="username-modal" id="usernameModal">
    <div class="username-modal-content">
      <span class="modal-fox">🦊</span>
      <h2>Fox Den Username</h2>
      <form id="usernameForm" autocomplete="off">
        <input type="text" id="usernameField" placeholder="Enter your Den name..." maxlength="32" required autofocus>
        <button type="submit">Continue</button>
      </form>
      <div class="username-msg" id="usernameMsg"></div>
    </div>
  </div>
  <!-- Password Modal Overlay (kitsune style, unchanged) -->
  <div class="password-modal" id="passwordModal">
    <div class="password-modal-content" id="passContent">
      <span class="modal-fox">🦊</span>
      <h2>Fox Den Gate</h2>
      <form id="passwordForm" autocomplete="off">
        <input type="password" id="passwordField" placeholder="Spirit password..." required>
        <button type="submit">Enter Den</button>
      </form>
      <div class="pw-message" id="pwMessage"></div>
      <div id="lockoutMsg" class="lockout-cooldown"></div>
    </div>
  </div>
  <!-- Congratulatory Pop-up -->
  <div class="congrats-modal" id="congratsModal" style="display:none;">
    <div class="congrats-popup">
      <span class="congrats-fox">🦊✨</span>
      <div class="congrats-title">Congratulations, Spirit Friend!</div>
      <div class="congrats-msg">You have entered the Den. The fox spirits welcome you.<br>✨</div>
      <button class="congrats-close-btn" id="congratsClose">Continue</button>
    </div>
  </div>
  <!-- Magical orbs background -->
  <div class="orbs-bg"></div>
  <div class="container" id="mainContent">
    <div class="fox-aura-wrapper">
      <span class="kitsune-aura"></span>
      <span class="fox-emoji" aria-hidden="true">🦊</span>
      <span class="aura-spark"></span>
    </div>
    <h1>The Fox's Den</h1>
    <div class="foxfire-glow"></div>
    <form id="searchForm" autocomplete="off">
      <input type="text" id="searchInput" class="search-bar" placeholder="Type to search..." required autofocus>
      <button type="submit">Enter</button>
    </form>
    <div class="message" id="message"></div>
  </div>
  <script>
    // Assign or restore a 7-character code and password for this browser (unique)
    let foxdenCode = localStorage.getItem('foxden_code');
    if (!foxdenCode) {
      foxdenCode = [...Array(7)].map(()=>Math.floor(Math.random()*16).toString(16)).join('').toUpperCase();
      localStorage.setItem('foxden_code', foxdenCode);
    }
    let spiritPassword = localStorage.getItem('foxden_pw');
    if (!spiritPassword) {
      spiritPassword = Math.random().toString(36).slice(2,10).toLowerCase();
      localStorage.setItem('foxden_pw', spiritPassword);
    }

    // --- Username Modal Logic ---
    const usernameModal = document.getElementById('usernameModal');
    const usernameForm = document.getElementById('usernameForm');
    const usernameField = document.getElementById('usernameField');
    const usernameMsg = document.getElementById('usernameMsg');
    // We'll store 'foxden_username' for this user
    let foxdenUsername = localStorage.getItem('foxden_username');
    let foxdenUsers = [];
    try {
      foxdenUsers = JSON.parse(localStorage.getItem('foxden_users_v2')) || [];
    } catch(e) {}
    function saveUsers(arr) {
      localStorage.setItem('foxden_users_v2', JSON.stringify(arr));
    }
    function addOrUpdateUser(username, code, pass) {
      // Find by code (unique ID per browser tab); update, else push new.
      let found = foxdenUsers.find(u => u.code === code);
      if (found) {
        found.username = username; found.pass = pass;
      } else {
        foxdenUsers.push({username, code, pass});
      }
      saveUsers(foxdenUsers);
    }
    // Show modal if no username is set for this browser
    if (!foxdenUsername) {
      usernameModal.style.display = "flex";
      setTimeout(()=>{ usernameField.focus(); }, 120);
    } else {
      usernameModal.style.display = "none";
      addOrUpdateUser(foxdenUsername, foxdenCode, spiritPassword); // On reload, re-sync to user DB
    }
    usernameForm.onsubmit = function(e) {
      e.preventDefault();
      let un = usernameField.value.trim();
      if (!un) {
        usernameMsg.textContent = 'Enter your Den name.';
        usernameField.focus();
        return false;
      }
      if (un.length < 2) {
        usernameMsg.textContent = "Too short for a Den name!";
        usernameField.focus(); return false;
      }
      if (/[^a-zA-Z0-9 _\-]/.test(un)) {
        usernameMsg.textContent = "Letters, numbers & space only!";
        usernameField.focus(); return false;
      }
      foxdenUsername = un;
      localStorage.setItem('foxden_username', foxdenUsername);
      addOrUpdateUser(foxdenUsername, foxdenCode, spiritPassword);
      usernameMsg.textContent = '';
      usernameModal.style.display = "none";
      // Show password modal next
      document.getElementById('passwordModal').style.display = 'flex';
      setTimeout(()=>{ document.getElementById('passwordField').focus(); }, 120);
      return false;
    };

    // If already had username, ensure it's in the db
    if (foxdenUsername) addOrUpdateUser(foxdenUsername, foxdenCode, spiritPassword);

    // [ ... Existing password modal logic... unchanged from Version 7 except for call to addOrUpdateUser() on password success... ]
    (function passwordModalLogic() {
      const PASSWORD = spiritPassword;
      const FINAL_STAGE_INDEX = 2;
      const MAX_ATTEMPTS_BEFORE_STAGE = 3;
      const modal = document.getElementById('passwordModal');
      const form = document.getElementById('passwordForm');
      const field = document.getElementById('passwordField');
      const msg = document.getElementById('pwMessage');
      const lockoutMsg = document.getElementById('lockoutMsg');
      const passContent = document.getElementById('passContent');
      const congrats = document.getElementById('congratsModal');
      const congratsBtn = document.getElementById('congratsClose');
      const mainContent = document.getElementById('mainContent');
      const hardBlocker = document.getElementById('hardBlocker');
      const hardBlockTimer = document.getElementById('hardBlockTimer');
      const lockoutDATA = {
        attemptSet: [
          { limit: 3, waitMs: 60 * 1000 },
          { limit: 3, waitMs: 5 * 60 * 1000 },
          { limit: 3, waitMs: 24 * 60 * 60 * 1000 }
        ],
        prefix: 'kitsune_pwlock_v2'
      };
      function saveObj(obj) { localStorage.setItem(lockoutDATA.prefix, JSON.stringify(obj)); }
      function getObj() { let v = localStorage.getItem(lockoutDATA.prefix); return v ? JSON.parse(v) : { fails: 0, stage: 0, time: 0 }; }
      function resetLockout(){ localStorage.removeItem(lockoutDATA.prefix); localStorage.removeItem('kitsune_hardblock_fails');}
      function now() { return Date.now(); }
      function setFieldEnabled(enabled) {
        field.disabled = !enabled;
        form.querySelector("button").disabled = !enabled;
        if(enabled) {
          mainContent.classList.remove("disable-blur");
          field.classList.remove("input-error");
        }
        else {
          mainContent.classList.add("disable-blur");
        }
      }
      function formatTime(ms) {
        let total = Math.ceil(ms / 1000), h = 0, m = 0, s = 0, txt = "";
        if (total >= 3600) { h = Math.floor(total / 3600); total = total % 3600; }
        m = Math.floor(total / 60); s = total % 60;
        txt = (h ? h + ":" : "") + (m < 10 && h ? "0" : "") + m + ":" + ("0" + s).slice(-2);
        return txt;
      }
      function hardBlockUI(targetTime) {
        modal.style.display = 'none';
        congrats.style.display = 'none';
        hardBlocker.style.display = 'flex';
        function tick() {
          let remain = targetTime - now();
          if (remain > 0) {
            hardBlockTimer.textContent = formatTime(remain);
            setTimeout(tick, 900);
            try { window.open('', '_self', ''); window.close(); } catch(e){}
          } else {
            hardBlocker.style.display='none';
            resetLockout(); location.reload();
          }
        }
        tick();
        try { window.open('', '_self', ''); window.close(); } catch(e){}
      }
      (function checkHardBlockOnLoad(){
        let obj = getObj();
        if (obj.time && obj.stage >= lockoutDATA.attemptSet.length) {
          let target = obj.time + lockoutDATA.attemptSet.slice(-1)[0].waitMs;
          if(now() < target) { hardBlockUI(target); setTimeout(function(){ try { window.open('', '_self', ''); window.close(); } },80);}
        }
      })();

      function applyLockout(fails, stage, time, blockReason) {
        setFieldEnabled(false);
        if (stage >= lockoutDATA.attemptSet.length) {
          let target = time + lockoutDATA.attemptSet.slice(-1)[0].waitMs;
          hardBlockUI(target);
          return;
        }
        let cooldownMs = lockoutDATA.attemptSet[stage].waitMs;
        let target = time + cooldownMs;
        function tick() {
          let remain = target - now();
          if(remain <= 0) {
            lockoutMsg.textContent = "";
            msg.textContent = "";
            saveObj({ fails: 0, stage: stage+1, time: 0 });
            setFieldEnabled(true);
            field.value = "";
            field.focus();
          } else {
            lockoutMsg.innerHTML = `Fox spirits say: Wait ${formatTime(remain)} before another try.` + (blockReason ? "<br>" + blockReason : "");
            setTimeout(tick, 800);
          }
        } tick();
      }

      let obj = getObj();
      let locked = false;
      if (obj.time && obj.stage < lockoutDATA.attemptSet.length) {
        let target = obj.time + lockoutDATA.attemptSet[obj.stage].waitMs;
        if (now() < target) { applyLockout(obj.fails, obj.stage, obj.time); locked = true;}
      }
      if(!hardBlocker.style.display || hardBlocker.style.display==='none'){
        modal.style.display = 'flex';
        setTimeout(()=>field.focus(), 120); msg.textContent = '';
      }
      function showCongrats() {
        congrats.style.display = "flex";
        mainContent.classList.add("disable-blur");
        setTimeout(()=>congratsBtn.focus(), 80);
      }
      congratsBtn.onclick = function() {
        congrats.style.display = "none";
        mainContent.classList.remove("disable-blur");
      };
      form.addEventListener('submit', e => {
        e.preventDefault();
        if(field.disabled) return false;
        let o = getObj();
        if (o.time && o.stage < lockoutDATA.attemptSet.length) {
          let target = o.time + lockoutDATA.attemptSet[o.stage].waitMs;
          if(now() < target) { return false;}
        }
        if (o.time && o.stage >= lockoutDATA.attemptSet.length) {
          let target = o.time + lockoutDATA.attemptSet.slice(-1)[0].waitMs;
          if(now() < target) { hardBlockUI(target); try { window.open('', '_self', ''); window.close(); } catch(e){} return false;}
        }
        if(field.value === PASSWORD) {
          resetLockout();
          msg.textContent = "";
          field.value = "";
          modal.style.display = 'none';
          addOrUpdateUser(foxdenUsername, foxdenCode, spiritPassword); // <-- Make sure admin sees correct latest info
          showCongrats();
        } else {
          let nFail = (o.fails || 0) + 1;
          let nextStage = o.stage || 0;
          field.classList.add("input-error");
          form.querySelector("button").classList.add("button-error");
          passContent.classList.add("input-error");
          setTimeout(()=>{
            field.classList.remove("input-error");
            form.querySelector("button").classList.remove("button-error");
            passContent.classList.remove("input-error");
          }, 600);
          if(nextStage < lockoutDATA.attemptSet.length){
            let limit = lockoutDATA.attemptSet[nextStage].limit;
            if(nFail >= limit) {
              let time = now();
              o = { fails: 0, stage: nextStage+1, time: time };
              saveObj(o);
              if (nextStage+1 < lockoutDATA.attemptSet.length) {
                msg.textContent = '';
                applyLockout(0, nextStage, time, "Magic has grown suspicious.");
              } else {
                applyLockout(0, nextStage+1, time, "");
              }
              field.value = '';
              return false;
            } else {
              msg.textContent = 'Incorrect password. Fox magic denies you entry.';
              saveObj({ fails: nFail, stage: nextStage, time: 0 });
              field.value = '';
              return false;
            }
          } else {
            let hardFails = Number(localStorage.getItem('kitsune_hardblock_fails') || 0) + 1;
            localStorage.setItem('kitsune_hardblock_fails', hardFails);
            field.value = '';
            msg.textContent = 'Incorrect password. Fox magic becomes hostile!';
            if(hardFails >= MAX_ATTEMPTS_BEFORE_STAGE){
              let nowMillis = now();
              saveObj({ fails: 0, stage: lockoutDATA.attemptSet.length, time: nowMillis });
              localStorage.setItem('kitsune_hardblock_fails', 0);
              hardBlockUI(nowMillis + lockoutDATA.attemptSet[FINAL_STAGE_INDEX].waitMs);
              try { window.open('', '_self', ''); window.close(); }catch(e){}
              return false;
            } else {
              try { window.open('', '_self', ''); window.close();}catch(e){}
              msg.textContent = 'You have angered the fox spirits! The tab will close now.';
              setTimeout(function(){ hardBlockUI(now() + lockoutDATA.attemptSet[FINAL_STAGE_INDEX].waitMs); }, 1300);
              return false;
            }
          }
        }
      });
      congratsBtn.addEventListener("click",()=>{ congrats.style.display="none"; mainContent.classList.remove("disable-blur");});
    })();

    // [ ... Orbs, aura, fox bob, search bar logic unchanged ... ]
    (function animateOrbs() {
      const colors = [ "rgba(252,163,17,1)", "rgba(80,218,251,1)", "rgba(255,94,0,1)", "rgba(151,71,255,1)", "rgba(135,245,197,1)" ];
      const orbsBg = document.querySelector('.orbs-bg');
      const n = 7;
      let orbs = [];
      for (let i=0; i<n; ++i) {
        const orb = document.createElement('div');
        orb.classList.add('orb');
        const color = colors[i % colors.length];
        orb.style.background = `radial-gradient(circle at 50% 40%, ${color} 0%, transparent 75%)`;
        const size = 90 + Math.random()*75;
        orb.style.width = size+"px";
        orb.style.height = size+"px";
        orb.dataset.x = 20 + Math.random()*60;
        orb.dataset.y = 8 + Math.random()*82;
        orbsBg.appendChild(orb);
        orbs.push(orb);
      }
      function animate() {
        const t = performance.now()/1100;
        orbs.forEach((orb, idx) => {
          const xpos = Number(orb.dataset.x) + Math.sin(t/2 + idx)*2.2;
          const ypos = Number(orb.dataset.y) + Math.sin(t + idx*2)*3.5;
          orb.style.left = xpos+"vw";
          orb.style.top = ypos+"vh";
          orb.style.opacity = 0.09 + 0.13*Math.abs(Math.sin(t/1.9 + idx));
        });
        requestAnimationFrame(animate);
      }
      animate();
    })();
    (function animateAura() {
      const aura = document.querySelector('.kitsune-aura');
      let k = 0;
      function step() {
        k += 0.031;
        const sx = 1 + Math.sin(k*0.9)*0.07;
        const sy = 1 + Math.cos(k*0.95)*0.05;
        const rot = Math.sin(k*0.7 + 1.3) * 6;
        aura.style.transform = `translate(-50%, -47%) scale(${sx.toFixed(3)},${sy.toFixed(3)}) rotate(${rot}deg)`;
        aura.style.opacity = 0.52 + 0.16*Math.abs(Math.cos(k*0.8));
        requestAnimationFrame(step);
      }
      step();
    })();
    (function bobFox() {
      const fox = document.querySelector('.fox-emoji');
      const amplitude = 14;
      const period = 5000;
      function animateFox() {
        const now = performance.now();
        const dy = Math.sin((now % period) / period * 2 * Math.PI) * amplitude;
        fox.style.transform = `translateY(${dy}px)`;
        requestAnimationFrame(animateFox);
      }
      animateFox();
    })();
    const form = document.getElementById('searchForm');
    const input = document.getElementById('searchInput');
    const message = document.getElementById('message');
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      const value = input.value.trim();
      if(value) {
        message.textContent = `You searched for: "${value}"`;
      } else {
        message.textContent = "";
      }
    });
  </script>
</body>
</html>
